[project]
name = "build-agent-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.6.0",
    "litellm>=1.83.4",
    "mcp[cli]>=1.27.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2.3",
    "scikit-learn>=1.8.0",
    "tavily>=1.1.0",
    "tavily-python>=0.7.23",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = ["black>=26.3.1", "mypy>=1.20.1", "pyright>=1.1.408"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["downloads", "gaia_cache"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownVariableType = false
venvPath = "."
venv = ".venv"
exclude = [
    "downloads",
    "gaia_cache",
    "**/gaia_cache",
    ".venv",
    "**/__pycache__",
]
